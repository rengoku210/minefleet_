version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: minefleet
      POSTGRES_USER: minefleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minefleet_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minefleet"]
      interval: 5s
      timeout: 5s
      retries: 5

  controller:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.controller
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://minefleet:${POSTGRES_PASSWORD:-minefleet_dev}@postgres:5432/minefleet
      CONTROLLER_HOST: 0.0.0.0
      CONTROLLER_PORT: 3001
      CONTROLLER_URL: ${CONTROLLER_URL:-http://localhost:3001}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_64_char_random_string_here_please}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-another_change_me_in_production_64_char_random_string}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@minefleet.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      NODE_ENV: production
    ports:
      - "3001:3001"

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dashboard
    depends_on:
      - controller
    ports:
      - "3000:80"

volumes:
  pgdata:
